name: Deploy to GitHub Releases

on: 
  schedule:
     - cron: '30 14 * * 6' 
  workflow_dispatch:
     
permissions:
  contents: write
  
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: windows-latest
            runtime: win-arm64
          - os: windows-latest
            runtime: win-x86
          - os: ubuntu-latest
            runtime: linux-x64
          - os: ubuntu-latest
            runtime: linux-arm64
          - os: macos-latest
            runtime: osx-x64
          - os: macos-latest
            runtime: osx-arm64

    runs-on: ${{ matrix.os }}
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Checkout External Dependency (Scratch-Format-Converter)
        uses: actions/checkout@v4
        with:
          repository: 'DaikoGames/Scratch-Format-Converter'
          path: Scratch-Format-Converter
          
      - name: Checkout External Dependency (Translator)
        uses: actions/checkout@v4
        with:
          repository: 'DaikoGames/Translate-Folder'
          path: Translate-Folder
          
      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and Publish App
        shell: bash
        run: |
          dotnet publish "./sb1 sb2 sb3 xml to Csharp converter.csproj" \
            -f net10.0 \
            -c Release \
            -r ${{ matrix.runtime }} \
            -o "./publish/${{ matrix.runtime }}" \
            -p:SelfContained=true \
            -p:PublishSingleFile=true

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Add dotnet tools to PATH
        shell: bash
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Add files (Windows)
        shell: pwsh
        if: contains(matrix.runtime, 'win')  
        run: |
          $baseDir = "./publish/${{ matrix.runtime }}"
          New-Item -ItemType Directory -Force -Path "$baseDir/ConverterIcon", "$baseDir/Scratch-Format-Converter", "$baseDir/Install", "$baseDir/svg_library_ScratchJnr", "$baseDir/wav_library_ScratchJnr"
          Copy-Item "./ConverterIcon/Converter.ico", "./ConverterIcon/Converter.png" "$baseDir/ConverterIcon/"
          Copy-Item "./Scratch-Format-Converter/Convert.js", "./Scratch-Format-Converter/package.json", "./Scratch-Format-Converter/package-lock.json" "$baseDir/Scratch-Format-Converter/"
          Copy-Item "./Install/dotnet-install.ps1" "$baseDir/Install/"
          Copy-Item -Path "./svg_library_ScratchJnr/*" "$baseDir/svg_library_ScratchJnr/"
          Copy-Item "./wav_library_ScratchJnr/*" "$baseDir/wav_library_ScratchJnr/" 
          Get-ChildItem -Path "./Translate-Folder" -Recurse -Filter "*.gz" | ForEach-Object { 
            $dn = $_.Directory.Name; New-Item -ItemType Directory -Force -Path "$baseDir/Translate-Folder/$dn" | Out-Null
            $out = $_.Name -replace '\.gz$', ''; gzip -d -c $_.FullName > "$baseDir/Translate-Folder/$dn/$out"; Remove-Item $_.FullName -Force 
          }
          Get-ChildItem -Path "./Translate-Folder" -Recurse -Filter "*.json" | ForEach-Object { Copy-Item $_.FullName "$baseDir/Translate-Folder/$($_.Directory.Name)/" -Force }
          Get-ChildItem -Path "./Translate-Folder" -Recurse -Filter "*.yml" | ForEach-Object { Copy-Item $_.FullName "$baseDir/Translate-Folder/$($_.Directory.Name)/" -Force }
          Copy-Item "./README.md" "$baseDir/"
  
      - name: Add Files (Linux, MacOS)
        shell: pwsh
        if: contains(matrix.runtime, 'linux') || contains(matrix.runtime, 'osx')
        run: |
          $baseDir = "./publish/${{ matrix.runtime }}"
          New-Item -ItemType Directory -Force -Path "$baseDir/ConverterIcon", "$baseDir/Scratch-Format-Converter", "$baseDir/Install", "$baseDir/svg_library_ScratchJnr", "$baseDir/wav_library_ScratchJnr"
          Copy-Item "./ConverterIcon/Converter.ico", "./ConverterIcon/Converter.png" "$baseDir/ConverterIcon/"
          Copy-Item "./Scratch-Format-Converter/Convert.js", "./Scratch-Format-Converter/package.json", "./Scratch-Format-Converter/package-lock.json" "$baseDir/Scratch-Format-Converter/"
          Copy-Item "./Install/dotnet-install.sh" "$baseDir/Install/"
          Copy-Item -Path "./svg_library_ScratchJnr/*" "$baseDir/svg_library_ScratchJnr/" 
          Copy-Item "./wav_library_ScratchJnr/*" "$baseDir/wav_library_ScratchJnr/" 
          Get-ChildItem -Path "./Translate-Folder" -Recurse -Filter "*.gz" | ForEach-Object { 
            $dn = $_.Directory.Name; New-Item -ItemType Directory -Force -Path "$baseDir/Translate-Folder/$dn" | Out-Null
            $out = $_.Name -replace '\.gz$', ''; gzip -d -c $_.FullName > "$baseDir/Translate-Folder/$dn/$out"; Remove-Item $_.FullName -Force 
          }
          Get-ChildItem -Path "./Translate-Folder" -Recurse -Filter "*.json" | ForEach-Object { Copy-Item $_.FullName "$baseDir/Translate-Folder/$($_.Directory.Name)/" -Force }
          Get-ChildItem -Path "./Translate-Folder" -Recurse -Filter "*.yml" | ForEach-Object { Copy-Item $_.FullName "$baseDir/Translate-Folder/$($_.Directory.Name)/" -Force }
          Copy-Item "./README.md" "$baseDir/"
          
      - name: Pack with Velopack Windows
        shell: bash
        if: contains(matrix.runtime, 'win')
        run: vpk pack -u "Converter" -v "0.9.${{ github.run_number }}" --packDir "./publish/${{ matrix.runtime }}" --outputDir "./Releases" --icon "./ConverterIcon/Converter.ico" --channel "${{ matrix.runtime }}"
            
      - name: Pack with Velopack Linux
        shell: bash
        if: contains(matrix.runtime, 'linux')
        run: vpk pack -u "Converter" -v "0.9.${{ github.run_number }}" --packDir "./publish/${{ matrix.runtime }}" --outputDir "./Releases" --icon "./ConverterIcon/Converter.png" --channel "${{ matrix.runtime }}"
            
      - name: Pack with Velopack MacOS
        shell: bash
        if: contains(matrix.runtime, 'osx')
        run: vpk pack -u "Converter" -v "0.9.${{ github.run_number }}" --packDir "./publish/${{ matrix.runtime }}" --outputDir "./Releases" --icon "./ConverterIcon/Converter.icns" --channel "${{ matrix.runtime }}"
            
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vpk-artifacts-${{ matrix.runtime }}
          path: ./Releases/*
          
  build-android:
    name: Build for PrimeOS / Bliss OS (x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Checkout External Dependency (Scratch-Format-Converter)
        uses: actions/checkout@v4
        with:
          repository: 'DaikoGames/Scratch-Format-Converter'
          path: Scratch-Format-Converter
          
      - name: Checkout External Dependency (Translator)
        uses: actions/checkout@v4
        with:
          repository: 'DaikoGames/Translate-Folder'
          path: Translate-Folder

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Workload
        run: |
          dotnet workload install android
          dotnet workload restore

      - name: Build Android x64 APK
        shell: bash
        run: |
          dotnet publish "./sb1 sb2 sb3 xml to Csharp converter.csproj" \
            -p:BuildAndroid=true \
            -f net10.0-android \
            -c Release \
            -r android-x64 \
            -o "./publish/android" \
            -p:AndroidPackageFormat=apk

      - name: Rename APK to exact expected filename
        shell: bash
        run: |
          mkdir -p ./Releases
          # .NET benennt Android-APKs oft um (z.B. mit -Signed). Wir finden die Datei und benennen sie exakt so um, wie der Release-Job sie erwartet.
          find ./publish/android -name "*.apk" -exec cp {} ./Releases/Converter-android-x64.apk \;
          echo "✅ APK erfolgreich umbenannt:"
          ls -la ./Releases/

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpk-artifacts-android-x64
          path: ./Releases/Converter-android-x64.apk

  release:
    needs: [build, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all-assets
          merge-multiple: true

      - name: Push to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.9.${{ github.run_number }}
          files: |
            ./all-assets/Converter-win-x86-Setup.exe
            ./all-assets/Converter-win-x64-Setup.exe
            ./all-assets/Converter-win-arm64-Setup.exe
            ./all-assets/Converter-osx-x64-Setup.pkg
            ./all-assets/Converter-osx-arm64-Setup.pkg
            ./all-assets/Converter-linux-x64-Setup.deb
            ./all-assets/Converter-linux-arm64-Setup.deb
            ./all-assets/Converter-win-x86-Portable.zip
            ./all-assets/Converter-win-x64-Portable.zip
            ./all-assets/Converter-win-arm64-Portable.zip
            ./all-assets/Converter-osx-x64-Portable.zip
            ./all-assets/Converter-osx-arm64-Portable.zip
            ./all-assets/Converter-android-x64.apk
