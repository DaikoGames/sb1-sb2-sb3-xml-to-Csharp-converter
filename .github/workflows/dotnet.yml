name: Deploy to GitHub Releases
on:
  schedule:
      - cron: '30 14 * * 6'
  workflow_dispatch:
    
permissions:
  contents: write
 
jobs:
  build-runtime-x86:
    name: Cross-compile .NET 9.0 x86 Runtime
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang cmake cpio curl git libicu-dev libkrb5-dev libssl-dev lld lldb llvm ninja-build pigz python-is-python3 zlib1g-dev python3 liblttng-ust-dev

      - name: Install i386 cross-compilation toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends crossbuild-essential-i386 binfmt-support debootstrap qemu-user-static

      - name: Install Debian archive keyring
        run: sudo apt-get install -y debian-archive-keyring

      - name: Setup .NET SDK (bootstrap)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Clone dotnet/runtime
        run: git clone --depth 1 --branch "release/9.0" https://github.com/dotnet/runtime.git ~/runtime

      - name: Surgical 32-bit Linux Memory Patches (Exact .NET 9 Symbols)
        run: |
          cd ~/runtime
          cat > /tmp/patch.py << 'PYEOF'
          import os, re

          def patch_file(path, patches):
              if not os.path.exists(path):
                  print(f"MISSING: {path}")
                  return
              with open(path, 'r', errors='replace') as f:
                  content = f.read()
              
              applied = 0
              for old, new, label in patches:
                  if old in content:
                      content = content.replace(old, new)
                      applied += 1
                      print(f"  [OK] {label}")
                  else:
                      print(f"  [SKIP] {label}")
                      
              if applied > 0:
                  with open(path, 'w') as f:
                      f.write(content)

          print("=== SURGICAL 32-BIT LINUX MEMORY PATCHES ===")
          gc_cpp = 'src/coreclr/gc/gc.cpp'
          patch_file(gc_cpp, [
              ('size_t      gc_heap::heap_hard_limit = 0;',
               '#if defined(TARGET_LINUX) && !defined(TARGET_64BIT)\nsize_t      gc_heap::heap_hard_limit = 64 * 1024 * 1024; /* PATCHED: 64MB for 32-bit Linux */\n#else\nsize_t      gc_heap::heap_hard_limit = 0;\n#endif',
               'Force 64MB heap hard limit'),
               
              ('bool        gc_heap::hard_limit_config_p = false;',
               '#if defined(TARGET_LINUX) && !defined(TARGET_64BIT)\nbool        gc_heap::hard_limit_config_p = true; /* PATCHED: Enable hard limit */\n#else\nbool        gc_heap::hard_limit_config_p = false;\n#endif',
               'Enable hard limit config'),
               
              ('const size_t min_segment_size_hard_limit = 1024*1024*16;',
               '#if defined(TARGET_LINUX) && !defined(TARGET_64BIT)\nconst size_t min_segment_size_hard_limit = 1024*1024*4; /* PATCHED: 4MB segments */\n#else\nconst size_t min_segment_size_hard_limit = 1024*1024*16;\n#endif',
               'Force 4MB min segment size')
          ])

          def simple_replace(path, old, new, label):
              if os.path.exists(path):
                  with open(path, 'r') as f: c = f.read()
                  if old in c:
                      with open(path, 'w') as f: f.write(c.replace(old, new))
                      print(f"  [OK] {label}")

          simple_replace('src/coreclr/vm/vars.hpp', 'CORProfilerDisableOptimizations()', 'false', 'Profiler vars')
          simple_replace('src/coreclr/vm/ceemain.cpp', 'BEGIN_PROFILER_CALLBACK(CORProfilerPresent());', 'if (false) {', 'Profiler begin')
          simple_replace('src/coreclr/vm/ceemain.cpp', 'CORProfilerPresent()', 'false', 'Profiler present')
          simple_replace('src/coreclr/vm/rejit.inl', 'CORProfilerEnableRejit() != FALSE', 'false', 'Rejit')
          simple_replace('src/coreclr/vm/eeprofinterfaces.inl', 'CORProfilerTrackAllocations()', 'FALSE', 'Alloc track')
          simple_replace('src/coreclr/vm/eetoprofinterfaceimpl.inl', 'CORProfilerPresent()', 'FALSE', 'Prof interface')

          filepath = 'src/coreclr/inc/profilepriv.inl'
          if os.path.exists(filepath):
              with open(filepath, 'r') as f: c = f.read()
              if not c.lstrip().startswith('#if FEATURE_PERFTRACING'):
                  with open(filepath, 'w') as f: f.write('#if FEATURE_PERFTRACING\n' + c + '\n#endif\n')
                  print("  [OK] Profilepriv guard")

          for host in ['corerun', 'apphost', 'singlefilehost']:
              fp = f'src/coreclr/hosts/{host}/CMakeLists.txt'
              if os.path.exists(fp):
                  with open(fp, 'r') as f: c = f.read()
                  pattern = r'(target_link_libraries\s*\(\s*' + host + r'\s+PRIVATE\s+coreclr_pal)'
                  if re.search(pattern, c):
                      c = re.sub(pattern, r'\1\n    -Wl,--start-group\n    dl\n    c\n    -Wl,--end-group', c)
                      with open(fp, 'w') as f: f.write(c)
                      print(f"  [OK] {host} linker")

          print("=== ALL SURGICAL PATCHES APPLIED ===")
          PYEOF
          python3 /tmp/patch.py

      - name: Generate cross rootfs for x86
        run: |
          cd ~/runtime
          sudo ./eng/common/cross/build-rootfs.sh "x86" "debian" "12" --skipunmount

      - name: Cross-compile .NET runtime and packs for linux-x86
        run: |
          cd ~/runtime
          export ROOTFS_DIR="$HOME/runtime/.tools/rootfs/x86"
          pkill -9 -f dotnet || true
          ~/runtime/.dotnet/dotnet build-server shutdown || true
          rm -rf ~/runtime/artifacts/obj ~/runtime/artifacts/bin ~/runtime/artifacts/packages
          # Added 'packs' to subset and removed GeneratePackageOnBuild=false to build the NuGet runtime pack!
          ./build.sh -subset clr+libs+host+packs -configuration Release -arch "x86" --cross \
            /p:UseAppHost=false /p:RunTests=false /p:BuildTests=false \
            /p:BuildInstaller=false /p:FeatureEventTrace=0 /p:FeaturePerfTracing=0 \
            /p:ContinuousIntegrationBuild=true \
            /p:BuildInParallel=false
        env:
          ROOTFS_DIR: /home/runner/runtime/.tools/rootfs/x86

      - name: Assemble and Package Custom SDK
        run: |
          set -e
          mkdir -p ~/custom-sdk
          BASE_SDK_DIR="$HOME/runtime/.dotnet"
          if [ -d "$BASE_SDK_DIR" ]; then cp -r "$BASE_SDK_DIR"/* ~/custom-sdk/ 2>/dev/null || true; fi
          rm -rf ~/custom-sdk/shared/Microsoft.NETCore.App
          rm -rf ~/custom-sdk/host/fxr
          rm -f ~/custom-sdk/dotnet
          rm -f ~/custom-sdk/dotnet-real
          DOTNET_HOST=$(find ~/runtime/artifacts/bin -type f -name "dotnet" | grep -iE "x86.*release" | head -n 1)
          HOSTFXR_BIN=$(find ~/runtime/artifacts/bin -type f -name "libhostfxr.so" | grep -iE "x86.*release" | head -n 1)
          TESTHOST_DIR=$(find ~/runtime/artifacts/bin/testhost -maxdepth 1 -type d | grep -iE "linux.*x86" | grep -i "release" | head -n 1)
          SHARED_VER_DIR=$(find "$TESTHOST_DIR/shared/Microsoft.NETCore.App" -maxdepth 1 -mindepth 1 -type d | head -n 1)
          SHARED_VER=$(basename "$SHARED_VER_DIR")
          cp "$DOTNET_HOST" ~/custom-sdk/dotnet-real
          chmod +x ~/custom-sdk/dotnet-real
          cat > ~/custom-sdk/dotnet << 'EOF'
          #!/bin/bash
          export DOTNET_gcServer=0
          export DOTNET_GCHeapCount=1
          export DOTNET_EnableDiagnostics=0
          export DOTNET_TieredPGO=0
          export DOTNET_ReadyToRun=0
          export DOTNET_DefaultStackSize=262144
          ulimit -s 256 2>/dev/null
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" &> /dev/null && pwd)"
          exec "$DIR/dotnet-real" "$@"
          EOF
          chmod +x ~/custom-sdk/dotnet
          mkdir -p ~/custom-sdk/host/fxr/$SHARED_VER
          cp "$HOSTFXR_BIN" ~/custom-sdk/host/fxr/$SHARED_VER/libhostfxr.so
          mkdir -p ~/custom-sdk/shared/Microsoft.NETCore.App/$SHARED_VER
          cp -r "$SHARED_VER_DIR"/* ~/custom-sdk/shared/Microsoft.NETCore.App/$SHARED_VER/
          
          # Extract the Runtime Pack so SelfContained=true works natively!
          RUNTIME_PACK_NUPKG=$(find ~/runtime/artifacts/packages -type f -name "Microsoft.NETCore.App.Runtime.linux-x86.*.nupkg" | head -n 1)
          if [ -n "$RUNTIME_PACK_NUPKG" ]; then
              echo "Found runtime pack: $RUNTIME_PACK_NUPKG"
              PACK_VER=$(basename "$RUNTIME_PACK_NUPKG" | sed -E 's/Microsoft\.NETCore\.App\.Runtime\.linux-x86\.(.*)\.nupkg/\1/')
              PACK_DEST=~/custom-sdk/packs/Microsoft.NETCore.App.Runtime.linux-x86/$PACK_VER
              mkdir -p "$PACK_DEST"
              unzip -q "$RUNTIME_PACK_NUPKG" -d "$PACK_DEST"
              echo "Extracted runtime pack to $PACK_DEST"
          else
              echo "WARNING: Runtime pack not found! SelfContained=true will fail."
          fi

          PACKS_DIR=~/custom-sdk/packs/Microsoft.NETCore.App.Host.linux-x86/$SHARED_VER/runtimes/linux-x86/native
          mkdir -p "$PACKS_DIR"
          APPHOST=$(find ~/runtime/artifacts/bin -type f -name "apphost" | grep -iE "x86.*release" | head -n 1)
          cp "$APPHOST" "$PACKS_DIR/apphost" && chmod +x "$PACKS_DIR/apphost"
          cd ~/custom-sdk && tar -czf ~/dotnet-linux-x86-sdk.tar.gz .

      - name: Upload Custom SDK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-linux-x86-sdk
          path: ~/dotnet-linux-x86-sdk.tar.gz

  build:
    needs: build-runtime-x86
    strategy:
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: windows-latest
            runtime: win-arm64
          - os: windows-latest
            runtime: win-x86
          - os: ubuntu-latest
            runtime: linux-x64
          - os: ubuntu-latest
            runtime: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Checkout External Dependency (Scratch-Format-Converter)
        uses: actions/checkout@v4
        with:
          repository: 'DaikoGames/Scratch-Format-Converter'
          path: Scratch-Format-Converter
      - name: Checkout External Dependency (Scratch-To-Snap)
        uses: actions/checkout@v4
        with:
          repository: 'DaikoGames/Scratch-To-Snap-'
          path: Scratch-To-Snap
      - name: Checkout External Dependency (Translator)
        uses: actions/checkout@v4
        with:
          repository: 'DaikoGames/Translate-Folder'
          path: Translate-Folder
          
      - name: Inject Trimmer Protections into .csproj
        shell: bash
        run: |
          sed -i 's|</Project>|  <ItemGroup>\n    <TrimmerRootAssembly Include="Avalonia" />\n    <TrimmerRootAssembly Include="Avalonia.Base" />\n    <TrimmerRootAssembly Include="Avalonia.Controls" />\n    <TrimmerRootAssembly Include="Avalonia.Skia" />\n    <TrimmerRootAssembly Include="Newtonsoft.Json" />\n    <TrimmerRootAssembly Include="LibVLCSharp" />\n    <TrimmerRootAssembly Include="Magick.NET-Q16-x86" />\n    <TrimmerRootAssembly Include="Magick.NET.Core" />\n    <TrimmerRootAssembly Include="HarfBuzzSharp" />\n    <TrimmerRootAssembly Include="SkiaSharp" />\n    <TrimmerRootAssembly Include="Converter" />\n  </ItemGroup>\n</Project>|' "./sb1 sb2 sb3 xml to Csharp converter.csproj"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          
      - name: Build and Publish App (Trimmed & SingleFile)
        shell: bash
        run: |
          dotnet publish "./sb1 sb2 sb3 xml to Csharp converter.csproj" -c Release -r ${{ matrix.runtime }} -o "./publish/${{ matrix.runtime }}" \
            -p:SelfContained=true \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=true \
            -p:TrimMode=partial \
            -p:IncludeNativeLibrariesForSelfExtract=true
            
      - name: Install Velopack CLI
        run: dotnet tool install -g vpk
      - name: Add dotnet tools to PATH
        shell: bash
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
        
      - name: Add files (Windows)
        shell: pwsh
        if: contains(matrix.runtime, 'win')
        run: |
          $baseDir = "./publish/${{ matrix.runtime }}"
          New-Item -ItemType Directory -Force -Path "$baseDir/ConverterIcon", "$baseDir/Scratch-Format-Converter", "$baseDir/Scratch-To-Snap", "$baseDir/Install", "$baseDir/svg_library_ScratchJnr", "$baseDir/wav_library_ScratchJnr"
          Copy-Item "./ConverterIcon/Converter.ico", "./ConverterIcon/Converter.png" "$baseDir/ConverterIcon/"
          Copy-Item "./Scratch-Format-Converter/Convert.js", "./Scratch-Format-Converter/package.json", "./Scratch-Format-Converter/package-lock.json" "$baseDir/Scratch-Format-Converter/"
          Copy-Item "./Scratch-To-Snap/converter.js", "./Scratch-To-Snap/package.json", "./Scratch-To-Snap/package-lock.json" "$baseDir/Scratch-To-Snap/"
          Copy-Item "./Install/dotnet-install.ps1" "$baseDir/Install/"
          Copy-Item -Path "./svg_library_ScratchJnr/*" "$baseDir/svg_library_ScratchJnr/"
          Copy-Item "./wav_library_ScratchJnr/*" "$baseDir/wav_library_ScratchJnr/"
          Get-ChildItem -Path "./Translate-Folder" -Recurse -Filter "*.gz" | ForEach-Object { $dn = $_.Directory.Name; New-Item -ItemType Directory -Force -Path "$baseDir/Translate-Folder/$dn" | Out-Null; gzip -d -c $_.FullName > "$baseDir/Translate-Folder/$dn/$($_.Name -replace '\.gz$', '')"; Remove-Item $_.FullName -Force }
          Get-ChildItem -Path "./Translate-Folder" -Recurse -Filter "*.json" | ForEach-Object { $dn = $_.Directory.Name; Copy-Item $_.FullName "$baseDir/Translate-Folder/$dn/" -Force }
          Get-ChildItem -Path "./Translate-Folder" -Recurse -Filter "*.yml" | ForEach-Object { $dn = $_.Directory.Name; Copy-Item $_.FullName "$baseDir/Translate-Folder/$dn/" -Force }
          Copy-Item "./README.md" "$baseDir/"
          
      - name: Add Files (Linux)
        shell: pwsh
        if: contains(matrix.runtime, 'linux')
        run: |
          $baseDir = "./publish/${{ matrix.runtime }}"
          New-Item -ItemType Directory -Force -Path "$baseDir/ConverterIcon", "$baseDir/Scratch-Format-Converter", "$baseDir/Scratch-To-Snap", "$baseDir/Install", "$baseDir/svg_library_ScratchJnr", "$baseDir/wav_library_ScratchJnr"
          Copy-Item "./ConverterIcon/Converter.ico", "./ConverterIcon/Converter.png" "$baseDir/ConverterIcon/"
          Copy-Item "./Scratch-Format-Converter/Convert.js", "./Scratch-Format-Converter/package.json", "./Scratch-Format-Converter/package-lock.json" "$baseDir/Scratch-Format-Converter/"
          Copy-Item "./Scratch-To-Snap/converter.js", "./Scratch-To-Snap/package.json", "./Scratch-To-Snap/package-lock.json" "$baseDir/Scratch-To-Snap/"
          Copy-Item "./Install/dotnet-install.sh" "$baseDir/Install/"
          Copy-Item -Path "./svg_library_ScratchJnr/*" "$baseDir/svg_library_ScratchJnr/"
          Copy-Item "./wav_library_ScratchJnr/*" "$baseDir/wav_library_ScratchJnr/"
          Get-ChildItem -Path "./Translate-Folder" -Recurse -Filter "*.gz" | ForEach-Object { $dn = $_.Directory.Name; New-Item -ItemType Directory -Force -Path "$baseDir/Translate-Folder/$dn" | Out-Null; gzip -d -c $_.FullName > "$baseDir/Translate-Folder/$dn/$($_.Name -replace '\.gz$', '')"; Remove-Item $_.FullName -Force }
          Get-ChildItem -Path "./Translate-Folder" -Recurse -Filter "*.json" | ForEach-Object { $dn = $_.Directory.Name; Copy-Item $_.FullName "$baseDir/Translate-Folder/$dn/" -Force }
          Get-ChildItem -Path "./Translate-Folder" -Recurse -Filter "*.yml" | ForEach-Object { $dn = $_.Directory.Name; Copy-Item $_.FullName "$baseDir/Translate-Folder/$dn/" -Force }
          Copy-Item "./README.md" "$baseDir/"
          
      - name: Check Help
        shell: bash
        run: vpk pack --help
        
      - name: Pack with Velopack Windows
        shell: bash
        if: contains(matrix.runtime, 'win')
        run: vpk pack -u "Converter" -v "0.9.${{ github.run_number }}" --packDir "./publish/${{ matrix.runtime }}" --outputDir "./Releases" --icon "./ConverterIcon/Converter.ico" --channel "${{ matrix.runtime }}"
        
      - name: Pack with Velopack Linux
        shell: bash
        if: contains(matrix.runtime, 'linux')
        run: vpk pack -u "Converter" -v "0.9.${{ github.run_number }}" --packDir "./publish/${{ matrix.runtime }}" --outputDir "./Releases" --icon "./ConverterIcon/Converter.png" --channel "${{ matrix.runtime }}"
        
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vpk-artifacts-${{ matrix.runtime }}
          path: ./Releases/*

  build_ubuntu-latest_linux-x86:
    name: Build Native Linux x86 App (Self-Contained & Trimmed)
    needs: build-runtime-x86
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Checkout External Dependency (Scratch-Format-Converter)
        uses: actions/checkout@v4
        with:
          repository: 'DaikoGames/Scratch-Format-Converter'
          path: Scratch-Format-Converter
      - name: Checkout External Dependency (Scratch-To-Snap)
        uses: actions/checkout@v4
        with:
          repository: 'DaikoGames/Scratch-To-Snap-'
          path: Scratch-To-Snap
      - name: Checkout External Dependency (Translator)
        uses: actions/checkout@v4
        with:
          repository: 'DaikoGames/Translate-Folder'
          path: Translate-Folder
          
      - name: Download Custom x86 Runtime
        uses: actions/download-artifact@v4
        with:
          name: dotnet-linux-x86-sdk
          path: ~/custom-sdk-tar
          
      - name: Extract Custom x86 Runtime
        run: |
          mkdir -p ~/custom-sdk
          tar -xzf ~/custom-sdk-tar/dotnet-linux-x86-sdk.tar.gz -C ~/custom-sdk
          
      - name: Inject Trimmer Protections into .csproj
        shell: bash
        run: |
          sed -i 's|</Project>|  <ItemGroup>\n    <TrimmerRootAssembly Include="Avalonia" />\n    <TrimmerRootAssembly Include="Avalonia.Base" />\n    <TrimmerRootAssembly Include="Avalonia.Controls" />\n    <TrimmerRootAssembly Include="Avalonia.Skia" />\n    <TrimmerRootAssembly Include="Newtonsoft.Json" />\n    <TrimmerRootAssembly Include="LibVLCSharp" />\n    <TrimmerRootAssembly Include="Magick.NET-Q16-x86" />\n    <TrimmerRootAssembly Include="Magick.NET.Core" />\n    <TrimmerRootAssembly Include="HarfBuzzSharp" />\n    <TrimmerRootAssembly Include="SkiaSharp" />\n    <TrimmerRootAssembly Include="Converter" />\n  </ItemGroup>\n</Project>|' "./sb1 sb2 sb3 xml to Csharp converter.csproj"

      - name: Restore and Publish App (Trimmed & SingleFile)
        shell: bash
        run: |
          # Use the custom x86 SDK we just built!
          CUSTOM_DOTNET="$HOME/custom-sdk/dotnet"
          chmod +x "$CUSTOM_DOTNET"
          
          "$CUSTOM_DOTNET" restore "./sb1 sb2 sb3 xml to Csharp converter.csproj" -r linux-x86 -p:RuntimeIdentifier=linux-x86 -p:ExcludeMagickX64=true
          
          "$CUSTOM_DOTNET" publish "./sb1 sb2 sb3 xml to Csharp converter.csproj" -c Release -r linux-x86 -o "./publish/linux-x86" \
            -p:SelfContained=true \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=true \
            -p:TrimMode=partial \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:RuntimeIdentifier=linux-x86 \
            -p:ExcludeMagickX64=true

      - name: Assemble Final App & Inject Debian i386 Native Libs
        shell: bash
        run: |
          mkdir -p ./final-linux-x86
          
          # Copy the single-file executable
          cp ./publish/linux-x86/Converter ./final-linux-x86/
          chmod +x ./final-linux-x86/Converter
          
          # Inject Debian i386 VLC plugins (LibVLC needs these dynamically)
          sudo dpkg --add-architecture i386
          sudo apt-get update
          mkdir -p ~/debs && cd ~/debs
          sudo apt-get download libvlc5:i386 libvlccore9:i386 vlc-plugin-base:i386 || true
          for deb in *.deb; do dpkg-deb -x "$deb" . || true; done
          find . -name "*.so*" -exec cp {} "$GITHUB_WORKSPACE/final-linux-x86"/ \;
          cd "$GITHUB_WORKSPACE"
          
          # Create run.sh with memory limits
          cat > ./final-linux-x86/run.sh << 'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" &> /dev/null && pwd)"
          export DOTNET_ROOT="$DIR"
          export LD_LIBRARY_PATH="$DIR:$LD_LIBRARY_PATH"
          export DOTNET_GCHeapHardLimitPercent=10
          export DOTNET_gcServer=0
          export DOTNET_GCHeapCount=1
          export DOTNET_EnableDiagnostics=0
          export DOTNET_EnableWriteXorExecute=0
          export DOTNET_TieredCompilation=0
          export DOTNET_ReadyToRun=0
          export DOTNET_DefaultStackSize=262144
          ulimit -s 256 2>/dev/null || true
          exec "$DIR/Converter" "$@"
          EOF
          chmod +x ./final-linux-x86/run.sh
          
          # Copy external assets
          mkdir -p ./final-linux-x86/ConverterIcon
          cp ./ConverterIcon/Converter.ico ./final-linux-x86/ConverterIcon/ || true
          cp ./ConverterIcon/Converter.png ./final-linux-x86/ConverterIcon/ || true
          mkdir -p ./final-linux-x86/Scratch-Format-Converter
          cp ./Scratch-Format-Converter/Convert.js ./final-linux-x86/Scratch-Format-Converter/ || true
          cp ./Scratch-Format-Converter/package.json ./final-linux-x86/Scratch-Format-Converter/ || true
          cp ./Scratch-Format-Converter/package-lock.json ./final-linux-x86/Scratch-Format-Converter/ || true
          mkdir -p ./final-linux-x86/Scratch-To-Snap
          cp ./Scratch-To-Snap/converter.js ./final-linux-x86/Scratch-To-Snap/ || true
          cp ./Scratch-To-Snap/package.json ./final-linux-x86/Scratch-To-Snap/ || true
          cp ./Scratch-To-Snap/package-lock.json ./final-linux-x86/Scratch-To-Snap/ || true
          mkdir -p ./final-linux-x86/svg_library_ScratchJnr
          cp -r ./svg_library_ScratchJnr/* ./final-linux-x86/svg_library_ScratchJnr/ 2>/dev/null || true
          mkdir -p ./final-linux-x86/wav_library_ScratchJnr
          cp -r ./wav_library_ScratchJnr/* ./final-linux-x86/wav_library_ScratchJnr/ 2>/dev/null || true
          
          find ./Translate-Folder -type f -name "*.gz" | while read gz_file; do dir_name=$(basename "$(dirname "$gz_file")"); mkdir -p "./final-linux-x86/Translate-Folder/$dir_name"; out_file=$(basename "$gz_file" .gz); gzip -d -c "$gz_file" > "./final-linux-x86/Translate-Folder/$dir_name/$out_file"; done
          find ./Translate-Folder -type f -name "*.json" | while read json_file; do dir_name=$(basename "$(dirname "$json_file")"); mkdir -p "./final-linux-x86/Translate-Folder/$dir_name"; cp "$json_file" "./final-linux-x86/Translate-Folder/$dir_name/"; done
          find ./Translate-Folder -type f -name "*.yml" | while read yml_file; do dir_name=$(basename "$(dirname "$yml_file")"); mkdir -p "./final-linux-x86/Translate-Folder/$dir_name"; cp "$yml_file" "./final-linux-x86/Translate-Folder/$dir_name/"; done
          cp ./README.md ./final-linux-x86/ || true

      - name: Create Linux x86 Package
        shell: bash
        run: tar -cJf Converter-linux-x86.tar.xz -C ./final-linux-x86 .

      - name: Upload Artifact (linux x86)
        uses: actions/upload-artifact@v4
        with:
          name: vpk-artifact-linux_x86
          path: ./Converter-linux-x86.tar.xz

  release:
    needs: [build, build-runtime-x86, build_ubuntu-latest_linux-x86]
    runs-on: ubuntu-latest
    steps:
      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: ./all-assets
          merge-multiple: true
      - name: Push to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.9.${{ github.run_number }}
          files: |
            ./all-assets/*