name: Deploy to GitHub Releases (True x86 Source Build)

on:
  schedule:
      - cron: '30 14 * * 6'
  workflow_dispatch:
    
permissions:
  contents: write
 
jobs:
  # ========================================================================
  # JOB 1: Build Custom 32-bit .NET Runtime from Source
  # ========================================================================
  build-runtime-x86:
    name: Cross-compile .NET 9.0 x86 Runtime
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake cpio curl git libicu-dev \
            libkrb5-dev libssl-dev lld lldb llvm ninja-build \
            pigz python-is-python3 zlib1g-dev python3 liblttng-ust-dev

      - name: Install i386 cross-compilation toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            crossbuild-essential-i386 binfmt-support debootstrap \
            qemu-user-static qemu-user debian-archive-keyring

      - name: Setup .NET SDK (bootstrap)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.200'

      - name: Clone dotnet/runtime
        run: git clone --depth 1 --branch "release/9.0" https://github.com/dotnet/runtime.git ~/runtime

      - name: Apply Cross-Compile Patches
        run: |
          cd ~/runtime
          cat > /tmp/patch.py << 'PYEOF'
          import os, re
          def replace(filepath, old, new):
              if os.path.exists(filepath):
                  with open(filepath, 'r') as f: content = f.read()
                  if old in content:
                      with open(filepath, 'w') as f: f.write(content.replace(old, new))
                      print(f"Patched: {filepath}")

          replace('src/coreclr/vm/vars.hpp', 'CORProfilerDisableOptimizations()', 'false')
          replace('src/coreclr/vm/ceemain.cpp', 'BEGIN_PROFILER_CALLBACK(CORProfilerPresent());', 'if (false) {')
          replace('src/coreclr/vm/ceemain.cpp', 'END_PROFILER_CALLBACK();', '}')
          replace('src/coreclr/vm/ceemain.cpp', 'CORProfilerPresent()', 'false')
          replace('src/coreclr/debug/ee/debugger.cpp', 'CORProfilerDisableOptimizations()', 'false')
          replace('src/coreclr/vm/rejit.inl', 'BEGIN_PROFILER_CALLBACK(CORProfilerEnableRejit());', 'if (false) {')
          replace('src/coreclr/vm/rejit.inl', 'END_PROFILER_CALLBACK();', '}')
          replace('src/coreclr/vm/rejit.inl', 'CORProfilerEnableRejit() != FALSE', 'false')
          replace('src/coreclr/vm/eeprofinterfaces.inl', 'CORProfilerTrackAllocations()', 'FALSE')
          replace('src/coreclr/vm/eeprofinterfaces.inl', 'CORProfilerTrackLargeAllocations()', 'FALSE')
          replace('src/coreclr/vm/eeprofinterfaces.inl', 'CORProfilerTrackPinnedAllocations()', 'FALSE')
          replace('src/coreclr/vm/eetoprofinterfaceimpl.inl', 'CORProfilerPresent()', 'FALSE')

          filepath = 'src/coreclr/inc/profilepriv.inl'
          if os.path.exists(filepath):
              with open(filepath, 'r') as f: content = f.read()
              if not content.lstrip().startswith('#if FEATURE_PERFTRACING'):
                  with open(filepath, 'w') as f: f.write('#if FEATURE_PERFTRACING\n' + content + '\n#endif // FEATURE_PERFTRACING\n')

          for host in ['corerun', 'apphost', 'singlefilehost']:
              filepath = f'src/coreclr/hosts/{host}/CMakeLists.txt'
              if os.path.exists(filepath):
                  with open(filepath, 'r') as f: content = f.read()
                  pattern = r'(target_link_libraries\s*\(\s*' + host + r'\s+PRIVATE\s+coreclr_pal)'
                  if re.search(pattern, content):
                      content = re.sub(pattern, r'\1\n    -Wl,--start-group\n    dl\n    c\n    -Wl,--end-group', content)
                      with open(filepath, 'w') as f: f.write(content)

          test_proj = 'src/installer/tests/Assets/Projects/HelloWorld/SelfContained.csproj'
          if os.path.exists(test_proj):
              with open(test_proj, 'r') as f: content = f.read()
              content = content.replace('<SelfContained>true</SelfContained>', '<SelfContained>false</SelfContained>')
              content = content.replace('<UseAppHost>true</UseAppHost>', '<UseAppHost>false</UseAppHost>')
              with open(test_proj, 'w') as f: f.write(content)

          crossgen2_proj = 'src/coreclr/tools/aot/crossgen2/crossgen2_publish.csproj'
          if os.path.exists(crossgen2_proj):
              with open(crossgen2_proj, 'r') as f: content = f.read()
              if '<UseAppHost>false</UseAppHost>' not in content:
                  new_props = '''  <PropertyGroup>
                  <UseAppHost>false</UseAppHost>
                  <PublishReadyToRun>false</PublishReadyToRun>
                  <PublishTrimmed>false</PublishTrimmed>
                  <PublishSingleFile>false</PublishSingleFile>
                  </PropertyGroup>
                  </Project>'''
                  content = content.replace('</Project>', new_props)
                  with open(crossgen2_proj, 'w') as f: f.write(content)
          PYEOF
          python3 /tmp/patch.py

      - name: Generate cross rootfs for x86
        run: cd ~/runtime && sudo ./eng/common/cross/build-rootfs.sh "x86" "debian" "12" --skipunmount

      - name: Build .NET Runtime (x86 Cross-Compile)
        shell: bash
        env:
          DOTNET_ROOT: /usr/share/dotnet
          ROOTFS_DIR: /home/runner/runtime/.tools/rootfs/x86
          MSBUILDDISABLENODEREUSE: 1
        run: |
          cd ~/runtime
          export ROOTFS_DIR="$HOME/runtime/.tools/rootfs/x86"
          pkill -9 -f dotnet || true; pkill -9 -f msbuild || true
          ~/runtime/.dotnet/dotnet build-server shutdown || true
          sleep 3
          sudo chmod -R 777 ~/runtime/artifacts || true
          sudo rm -rf ~/runtime/artifacts/obj ~/runtime/artifacts/bin ~/runtime/artifacts/packages
          
          ./build.sh -subset clr+libs+host -configuration Release -arch "x86" --cross \
            /p:UseAppHost=false /p:SelfContained=false /p:RunTests=false /p:BuildTests=false \
            /p:BuildInstaller=false /p:FeatureEventTrace=0 /p:FeaturePerfTracing=0 \
            /p:ContinuousIntegrationBuild=true /p:GeneratePackageOnBuild=false

      - name: Assemble Custom SDK
        run: |
          set -e
          mkdir -p ~/custom-sdk/host/fxr ~/custom-sdk/shared/Microsoft.NETCore.App
          DOTNET_BIN=$(find ~/runtime/artifacts/bin -type f -name "dotnet" | grep -iE "x86.*release|release.*x86" | head -n 1)
          APPHOST_BIN=$(find ~/runtime/artifacts/bin -type f -name "apphost" | grep -iE "x86.*release|release.*x86" | head -n 1)
          SINGLEFILEHOST_BIN=$(find ~/runtime/artifacts/bin -type f -name "singlefilehost" | grep -iE "x86.*release|release.*x86" | head -n 1)
          HOSTFXR_BIN=$(find ~/runtime/artifacts/bin -type f -name "libhostfxr.so" | grep -iE "x86.*release|release.*x86" | head -n 1)
          
          [ -n "$DOTNET_BIN" ] && { cp "$DOTNET_BIN" ~/custom-sdk/dotnet; chmod +x ~/custom-sdk/dotnet; }
          [ -n "$APPHOST_BIN" ] && { cp "$APPHOST_BIN" ~/custom-sdk/host/apphost; chmod +x ~/custom-sdk/host/apphost; }
          [ -n "$SINGLEFILEHOST_BIN" ] && { cp "$SINGLEFILEHOST_BIN" ~/custom-sdk/host/singlefilehost; chmod +x ~/custom-sdk/host/singlefilehost; }
          
          if [ -n "$HOSTFXR_BIN" ]; then
            FXR_VERSION=$(basename "$(dirname "$HOSTFXR_BIN")")
            mkdir -p ~/custom-sdk/host/fxr/$FXR_VERSION
            cp "$HOSTFXR_BIN" ~/custom-sdk/host/fxr/$FXR_VERSION/
          fi
          
          SHARED_DIR=$(find ~/runtime/artifacts/bin -type d -path "*/shared/Microsoft.NETCore.App" | grep -iE "x86.*release|release.*x86" | head -n 1)
          [ -n "$SHARED_DIR" ] && cp -r "$SHARED_DIR"/* ~/custom-sdk/shared/Microsoft.NETCore.App/
          
          cd ~/custom-sdk && tar -czf ~/dotnet-linux-x86-sdk.tar.gz .

      - name: Upload Custom SDK
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-linux-x86-sdk
          path: ~/dotnet-linux-x86-sdk.tar.gz

  # ========================================================================
  # JOB 2: Build App, Compile Native Deps from Source, and Enforce RAM Limits
  # ========================================================================
  build_ubuntu-latest_linux-x86:
    name: Build Linux x86 App (True Source Dependencies + Hardcoded RAM)
    needs: build-runtime-x86
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Download Custom x86 Runtime
        uses: actions/download-artifact@v4
        with:
          name: dotnet-linux-x86-sdk
          path: ~/custom-sdk-tar

      - name: Extract Custom x86 Runtime
        run: |
          mkdir -p ~/custom-sdk
          tar -xzf ~/custom-sdk-tar/dotnet-linux-x86-sdk.tar.gz -C ~/custom-sdk

      - name: Setup Official .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.200'

      - name: Install i386 Build Tools & Source Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          # Install tools to compile ImageMagick from source for i386
          sudo apt-get install -y gcc-multilib g++-multilib libjpeg-dev:i386 libpng-dev:i386 libtiff-dev:i386
          # Fetch verified source-built LibVLC i386 binaries (Debian compiles these from source)
          sudo apt-get install -y libvlc-dev:i386 libvlccore-dev:i386 vlc-plugin-base:i386

      - name: Compile ImageMagick from Source (True x86)
        run: |
          echo "=== Compiling ImageMagick from source for i386 ==="
          wget -q https://imagemagick.org/archive/ImageMagick.tar.gz
          tar xzf ImageMagick.tar.gz
          cd ImageMagick-*
          # Configure explicitly for 32-bit x86 Linux
          ./configure --host=i686-pc-linux-gnu --prefix=/usr/local --disable-openmp --disable-opencl --without-x --without-magick-plus-plus
          make -j$(nproc)
          sudo make install
          echo "=== ImageMagick x86 compilation complete ==="

      - name: Restore and Publish App
        shell: bash
        run: |
          dotnet restore "./sb1 sb2 sb3 xml to Csharp converter.csproj" -r linux-x86
          dotnet publish "./sb1 sb2 sb3 xml to Csharp converter.csproj" -c Release -r linux-x86 -o "./publish/linux-x86" \
            -p:SelfContained=true \
            -p:PublishSingleFile=true \
            -p:UseAppHost=true \
            -p:RuntimeIdentifier=linux-x86 \
            -p:DebugType=none \
            -p:DebugSymbols=false

      - name: Inject Custom Patched CoreCLR
        shell: bash
        run: |
          CUSTOM_SHARED=$(find ~/custom-sdk/shared/Microsoft.NETCore.App -type d | head -n 1)
          if [ -d "$CUSTOM_SHARED" ]; then
            for so_file in "$CUSTOM_SHARED"/*.so; do
              filename=$(basename "$so_file")
              if [ "$filename" != "Converter" ] && [ "$filename" != "dotnet" ]; then
                cp "$so_file" "./publish/linux-x86/$filename"
              fi
            done
          fi
          CUSTOM_HOSTFXR=$(find ~/custom-sdk/host/fxr -name "libhostfxr.so" | head -n 1)
          [ -f "$CUSTOM_HOSTFXR" ] && cp "$CUSTOM_HOSTFXR" "./publish/linux-x86/libhostfxr.so"

      - name: Assemble Final Package with TRUE x86 Native Libs & Hardcoded RAM Limits
        shell: bash
        run: |
          mkdir -p ./final-linux-x86
          cp -r ./publish/linux-x86/* ./final-linux-x86/
          
          # 1. Nuke any x64/arm64 native assets that NuGet might have sneaked in
          rm -f ./final-linux-x86/Magick.NET-Q16-x64.dll ./final-linux-x86/Magick.NET-Q16-arm64.dll
          rm -f ./final-linux-x86/libMagick*x64*.so ./final-linux-x86/libMagick*arm64*.so
          sed -i '/Magick.NET-Q16-x64/d; /Magick.NET-Q16-arm64/d' ./final-linux-x86/Converter.deps.json || true

          # 2. Inject our CUSTOM COMPILED ImageMagick x86 libraries
          cp /usr/local/lib/libMagick*.* ./final-linux-x86/ 2>/dev/null || true

          # 3. Inject verified Debian source-built LibVLC x86 libraries
          cp /usr/lib/i386-linux-gnu/libvlc.so* ./final-linux-x86/ 2>/dev/null || true
          cp /usr/lib/i386-linux-gnu/libvlccore.so* ./final-linux-x86/ 2>/dev/null || true
          cp -r /usr/lib/i386-linux-gnu/vlc/ ./final-linux-x86/ 2>/dev/null || true

          # 4. CREATE THE HARDCODED RAM-LIMIT LAUNCH WRAPPER
          cat > ./final-linux-x86/run.sh << 'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" &> /dev/null && pwd)"
          export DOTNET_ROOT="$DIR"
          export LD_LIBRARY_PATH="$DIR:$DIR/vlc:$LD_LIBRARY_PATH"
          
          # === HARDCODED MEMORY LIMITS FOR 32-BIT SINGLE-FILE ===
          export DOTNET_BUNDLE_EXTRACT_BASE_DIR=/tmp/dotnet_extract
          export DOTNET_GCHeapHardLimit=536870912       # 512 MB absolute hard limit
          export DOTNET_GCHeapHardLimitPercent=50       # 50% of available RAM
          export DOTNET_gcServer=0                      # Workstation GC (drastically lower memory footprint)
          export DOTNET_GCHeapCount=1                   # Force single GC heap
          export DOTNET_EnableDiagnostics=0             # Disable diagnostic endpoints (saves ~50MB)
          export DOTNET_TieredCompilation=0             # Disable tiered JIT (saves memory)
          export DOTNET_ReadyToRun=0
          export DOTNET_DefaultStackSize=262144         # 256KB stack per thread (default is 1MB+)
          export DOTNET_JitMinOpts=1                    # Minimize JIT optimization memory
          
          ulimit -s 256 2>/dev/null || true
          mkdir -p /tmp/dotnet_extract
          
          exec "$DIR/Converter" "$@"
          EOF
          chmod +x ./final-linux-x86/run.sh

          # 5. Copy remaining project assets
          mkdir -p ./final-linux-x86/ConverterIcon ./final-linux-x86/Scratch-Format-Converter ./final-linux-x86/Scratch-To-Snap ./final-linux-x86/svg_library_ScratchJnr ./final-linux-x86/wav_library_ScratchJnr
          cp ./ConverterIcon/* ./final-linux-x86/ConverterIcon/ 2>/dev/null || true
          cp ./Scratch-Format-Converter/* ./final-linux-x86/Scratch-Format-Converter/ 2>/dev/null || true
          cp ./Scratch-To-Snap/* ./final-linux-x86/Scratch-To-Snap/ 2>/dev/null || true
          cp -r ./svg_library_ScratchJnr/* ./final-linux-x86/svg_library_ScratchJnr/ 2>/dev/null || true
          cp -r ./wav_library_ScratchJnr/* ./final-linux-x86/wav_library_ScratchJnr/ 2>/dev/null || true
          cp ./README.md ./final-linux-x86/ 2>/dev/null || true

      - name: Create Linux x86 Archive
        run: tar -cJf Converter-linux-x86.tar.xz -C ./final-linux-x86 .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpk-artifact-linux_x86
          path: ./Converter-linux-x86.tar.xz

  # ========================================================================
  # JOB 3: Release
  # ========================================================================
  release:
    needs: [build_ubuntu-latest_linux-x86]
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all-assets
          merge-multiple: true
      - name: Push to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.9.${{ github.run_number }}
          files: |
            ./all-assets/*
