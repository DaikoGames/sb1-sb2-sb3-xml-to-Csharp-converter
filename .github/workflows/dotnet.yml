name: Deploy to GitHub Releases

on:
  schedule:
    - cron: '30 14 * * 6'
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-runtime-x86:
    name: Cross-compile .NET 9.0 x86 Runtime
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache runtime build
        id: cache-runtime
        uses: actions/cache@v4
        with:
          path: ~/runtime/artifacts/bin
          key: runtime-x86-${{ github.sha }}
          restore-keys: runtime-x86-

      - name: Install build prerequisites
        if: steps.cache-runtime.outputs.cache-hit != 'true'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake cpio curl git \
            libicu-dev libkrb5-dev libssl-dev lld lldb llvm \
            ninja-build pigz python-is-python3 python3 zlib1g-dev \
            liblttng-ust-dev crossbuild-essential-i386 binfmt-support \
            debootstrap qemu-user-static debian-archive-keyring

      - name: Setup .NET SDK
        if: steps.cache-runtime.outputs.cache-hit != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Clone dotnet/runtime
        if: steps.cache-runtime.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "release/9.0" https://github.com/dotnet/runtime.git ~/runtime

      - name: Apply 32-bit memory patches
        if: steps.cache-runtime.outputs.cache-hit != 'true'
        run: |
          cd ~/runtime
          cat > /tmp/patch.py << 'PYEOF'
          import os, re

          def patch_file(path, patches):
              if not os.path.exists(path):
                  print(f"MISSING: {path}")
                  return
              with open(path, 'r', errors='replace') as f:
                  content = f.read()
              applied = 0
              for old, new, label in patches:
                  if old in content:
                      content = content.replace(old, new)
                      applied += 1
                      print(f"  [OK] {label}")
              if applied > 0:
                  with open(path, 'w') as f:
                      f.write(content)

          print("=== SURGICAL 32-BIT LINUX MEMORY PATCHES ===")

          gc_cpp = 'src/coreclr/gc/gc.cpp'
          patch_file(gc_cpp, [
              ('size_t      gc_heap::heap_hard_limit = 0;',
               '#if defined(TARGET_LINUX) && !defined(TARGET_64BIT)\nsize_t      gc_heap::heap_hard_limit = 64 * 1024 * 1024;\n#else\nsize_t      gc_heap::heap_hard_limit = 0;\n#endif',
               'Force 64MB heap hard limit'),
              ('bool        gc_heap::hard_limit_config_p = false;',
               '#if defined(TARGET_LINUX) && !defined(TARGET_64BIT)\nbool        gc_heap::hard_limit_config_p = true;\n#else\nbool        gc_heap::hard_limit_config_p = false;\n#endif',
               'Enable hard limit config'),
              ('const size_t min_segment_size_hard_limit = 1024*1024*16;',
               '#if defined(TARGET_LINUX) && !defined(TARGET_64BIT)\nconst size_t min_segment_size_hard_limit = 1024*1024*4;\n#else\nconst size_t min_segment_size_hard_limit = 1024*1024*16;\n#endif',
               'Force 4MB min segment size')
          ])

          def simple_replace(path, old, new, label):
              if os.path.exists(path):
                  with open(path, 'r') as f: c = f.read()
                  if old in c:
                      with open(path, 'w') as f: f.write(c.replace(old, new))
                      print(f"  [OK] {label}")

          simple_replace('src/coreclr/vm/vars.hpp', 'CORProfilerDisableOptimizations()', 'false', 'Profiler vars')
          simple_replace('src/coreclr/vm/ceemain.cpp', 'BEGIN_PROFILER_CALLBACK(CORProfilerPresent());', 'if (false) {', 'Profiler begin')
          simple_replace('src/coreclr/vm/ceemain.cpp', 'CORProfilerPresent()', 'false', 'Profiler present')
          simple_replace('src/coreclr/vm/rejit.inl', 'CORProfilerEnableRejit() != FALSE', 'false', 'Rejit')
          simple_replace('src/coreclr/vm/eeprofinterfaces.inl', 'CORProfilerTrackAllocations()', 'FALSE', 'Alloc track')
          simple_replace('src/coreclr/vm/eetoprofinterfaceimpl.inl', 'CORProfilerPresent()', 'FALSE', 'Prof interface')

          filepath = 'src/coreclr/inc/profilepriv.inl'
          if os.path.exists(filepath):
              with open(filepath, 'r') as f: c = f.read()
              if not c.lstrip().startswith('#if FEATURE_PERFTRACING'):
                  with open(filepath, 'w') as f: f.write('#if FEATURE_PERFTRACING\n' + c + '\n#endif\n')
                  print("  [OK] Profilepriv guard")

          for host in ['corerun', 'apphost', 'singlefilehost']:
              fp = f'src/coreclr/hosts/{host}/CMakeLists.txt'
              if os.path.exists(fp):
                  with open(fp, 'r') as f: c = f.read()
                  pattern = r'(target_link_libraries\s*\(\s*' + host + r'\s+PRIVATE\s+coreclr_pal)'
                  if re.search(pattern, c):
                      c = re.sub(pattern, r'\1\n    -Wl,--start-group\n    dl\n    c\n    -Wl,--end-group', c)
                      with open(fp, 'w') as f: f.write(c)
                      print(f"  [OK] {host} linker")

          print("=== ALL PATCHES APPLIED ===")
          PYEOF
          python3 /tmp/patch.py

      - name: Generate cross rootfs for x86
        if: steps.cache-runtime.outputs.cache-hit != 'true'
        run: |
          cd ~/runtime
          sudo ./eng/common/cross/build-rootfs.sh "x86" "debian" "12" --skipunmount

      - name: Cross-compile .NET runtime for linux-x86
        if: steps.cache-runtime.outputs.cache-hit != 'true'
        run: |
          cd ~/runtime
          export ROOTFS_DIR="$HOME/runtime/.tools/rootfs/x86"
          pkill -9 -f dotnet || true
          ~/runtime/.dotnet/dotnet build-server shutdown || true
          rm -rf ~/runtime/artifacts/obj
          ./build.sh -subset clr+libs+host+packs -configuration Release -arch "x86" --cross \
            /p:RunTests=false /p:BuildTests=false \
            /p:BuildInstaller=false /p:FeatureEventTrace=0 /p:FeaturePerfTracing=0 \
            /p:ContinuousIntegrationBuild=true /p:BuildInParallel=false
        env:
          ROOTFS_DIR: /home/runner/runtime/.tools/rootfs/x86

      - name: Assemble custom SDK
        run: |
          set -e
          mkdir -p ~/custom-sdk
          BASE_SDK_DIR="$HOME/runtime/.dotnet"
          [ -d "$BASE_SDK_DIR" ] && cp -r "$BASE_SDK_DIR"/* ~/custom-sdk/ 2>/dev/null || true
          rm -rf ~/custom-sdk/shared/Microsoft.NETCore.App ~/custom-sdk/host/fxr ~/custom-sdk/dotnet ~/custom-sdk/dotnet-real

          DOTNET_HOST=$(find ~/runtime/artifacts/bin -type f -name "dotnet" | grep -iE "x86.*release" | head -n 1)
          HOSTFXR_BIN=$(find ~/runtime/artifacts/bin -type f -name "libhostfxr.so" | grep -iE "x86.*release" | head -n 1)
          TESTHOST_DIR=$(find ~/runtime/artifacts/bin/testhost -maxdepth 1 -type d | grep -iE "linux.*x86" | grep -i "release" | head -n 1)
          SHARED_VER_DIR=$(find "$TESTHOST_DIR/shared/Microsoft.NETCore.App" -maxdepth 1 -mindepth 1 -type d | head -n 1)
          SHARED_VER=$(basename "$SHARED_VER_DIR")

          cp "$DOTNET_HOST" ~/custom-sdk/dotnet-real
          chmod +x ~/custom-sdk/dotnet-real
          cat > ~/custom-sdk/dotnet << 'EOF'
          #!/bin/bash
          export DOTNET_gcServer=0 DOTNET_GCHeapCount=1 DOTNET_EnableDiagnostics=0
          export DOTNET_TieredPGO=0 DOTNET_ReadyToRun=0 DOTNET_DefaultStackSize=262144
          ulimit -s 256 2>/dev/null
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" &> /dev/null && pwd)"
          exec "$DIR/dotnet-real" "$@"
          EOF
          chmod +x ~/custom-sdk/dotnet

          mkdir -p ~/custom-sdk/host/fxr/$SHARED_VER
          cp "$HOSTFXR_BIN" ~/custom-sdk/host/fxr/$SHARED_VER/libhostfxr.so
          mkdir -p ~/custom-sdk/shared/Microsoft.NETCore.App/$SHARED_VER
          cp -r "$SHARED_VER_DIR"/* ~/custom-sdk/shared/Microsoft.NETCore.App/$SHARED_VER/

          PACKS_DIR=~/custom-sdk/packs/Microsoft.NETCore.App.Host.linux-x86/$SHARED_VER/runtimes/linux-x86/native
          mkdir -p "$PACKS_DIR"
          APPHOST=$(find ~/runtime/artifacts/bin -type f -name "apphost" | grep -iE "x86.*release" | head -n 1)
          [ -n "$APPHOST" ] && cp "$APPHOST" "$PACKS_DIR/apphost" && chmod +x "$PACKS_DIR/apphost"

          cd ~/custom-sdk && tar -czf ~/dotnet-linux-x86-sdk.tar.gz .

      - name: Upload Custom SDK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-linux-x86-sdk
          path: ~/dotnet-linux-x86-sdk.tar.gz
          retention-days: 7

  build:
    needs: build-runtime-x86
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: windows-latest
            runtime: win-arm64
          - os: windows-latest
            runtime: win-x86
          - os: ubuntu-latest
            runtime: linux-x64
          - os: ubuntu-latest
            runtime: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Checkout dependencies
        uses: actions/checkout@v4
        with:
          repository: 'DaikoGames/Scratch-Format-Converter'
          path: Scratch-Format-Converter

      - name: Checkout Scratch-To-Snap
        uses: actions/checkout@v4
        with:
          repository: 'DaikoGames/Scratch-To-Snap-'
          path: Scratch-To-Snap

      - name: Checkout Translator
        uses: actions/checkout@v4
        with:
          repository: 'DaikoGames/Translate-Folder'
          path: Translate-Folder

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build and Publish App (Trimmed + SingleFile)
        shell: bash
        run: |
          dotnet publish "./sb1 sb2 sb3 xml to Csharp converter.csproj" \
            -c Release -r ${{ matrix.runtime }} \
            -o "./publish/${{ matrix.runtime }}" \
            -p:SelfContained=true \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=true \
            -p:TrimMode=partial \
            -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Install Velopack CLI
        shell: bash
        run: dotnet tool install -g vpk

      - name: Add dotnet tools to PATH
        shell: bash
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Copy extra files
        shell: pwsh
        run: |
          $baseDir = "./publish/${{ matrix.runtime }}"
          $dirs = @("ConverterIcon", "Scratch-Format-Converter", "Scratch-To-Snap", "Install", "svg_library_ScratchJnr", "wav_library_ScratchJnr", "Translate-Folder")
          foreach ($d in $dirs) { New-Item -ItemType Directory -Force -Path "$baseDir/$d" | Out-Null }

          Copy-Item "./ConverterIcon/Converter.ico", "./ConverterIcon/Converter.png" "$baseDir/ConverterIcon/"
          Copy-Item "./Scratch-Format-Converter/Convert.js", "./Scratch-Format-Converter/package.json", "./Scratch-Format-Converter/package-lock.json" "$baseDir/Scratch-Format-Converter/"
          Copy-Item "./Scratch-To-Snap/converter.js", "./Scratch-To-Snap/package.json", "./Scratch-To-Snap/package-lock.json" "$baseDir/Scratch-To-Snap/"

          if ("${{ matrix.runtime }}" -like "win*") {
            Copy-Item "./Install/dotnet-install.ps1" "$baseDir/Install/"
          } else {
            Copy-Item "./Install/dotnet-install.sh" "$baseDir/Install/"
          }

          Copy-Item -Path "./svg_library_ScratchJnr/*" "$baseDir/svg_library_ScratchJnr/"
          Copy-Item "./wav_library_ScratchJnr/*" "$baseDir/wav_library_ScratchJnr/"

          Get-ChildItem -Path "./Translate-Folder" -Recurse -Filter "*.gz" | ForEach-Object {
            $dn = $_.Directory.Name
            New-Item -ItemType Directory -Force -Path "$baseDir/Translate-Folder/$dn" | Out-Null
            gzip -d -c $_.FullName > "$baseDir/Translate-Folder/$dn/$($_.Name -replace '\.gz$', '')"
            Remove-Item $_.FullName -Force
          }
          Get-ChildItem -Path "./Translate-Folder" -Recurse -Filter "*.json" | ForEach-Object {
            $dn = $_.Directory.Name
            New-Item -ItemType Directory -Force -Path "$baseDir/Translate-Folder/$dn" | Out-Null
            Copy-Item $_.FullName "$baseDir/Translate-Folder/$dn/" -Force
          }
          Get-ChildItem -Path "./Translate-Folder" -Recurse -Filter "*.yml" | ForEach-Object {
            $dn = $_.Directory.Name
            New-Item -ItemType Directory -Force -Path "$baseDir/Translate-Folder/$dn" | Out-Null
            Copy-Item $_.FullName "$baseDir/Translate-Folder/$dn/" -Force
          }
          Copy-Item "./README.md" "$baseDir/"

      - name: Pack with Velopack
        shell: bash
        run: |
          ICON="./ConverterIcon/Converter.ico"
          if [[ "${{ matrix.runtime }}" == linux* ]]; then
            ICON="./ConverterIcon/Converter.png"
          fi
          vpk pack -u "Converter" -v "0.9.${{ github.run_number }}" \
            --packDir "./publish/${{ matrix.runtime }}" \
            --outputDir "./Releases" \
            --icon "$ICON" \
            --channel "${{ matrix.runtime }}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vpk-artifacts-${{ matrix.runtime }}
          path: ./Releases/*
          retention-days: 7

  build_ubuntu-latest_linux-x86:
    name: Build Native Linux x86 App (Self-Contained)
    needs: build-runtime-x86
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Checkout dependencies
        uses: actions/checkout@v4
        with:
          repository: 'DaikoGames/Scratch-Format-Converter'
          path: Scratch-Format-Converter

      - name: Checkout Scratch-To-Snap
        uses: actions/checkout@v4
        with:
          repository: 'DaikoGames/Scratch-To-Snap-'
          path: Scratch-To-Snap

      - name: Checkout Translator
        uses: actions/checkout@v4
        with:
          repository: 'DaikoGames/Translate-Folder'
          path: Translate-Folder

      - name: Download Custom x86 Runtime
        uses: actions/download-artifact@v4
        with:
          name: dotnet-linux-x86-sdk
          path: ~/custom-sdk-tar

      - name: Extract Custom x86 Runtime
        run: |
          mkdir -p ~/custom-sdk
          tar -xzf ~/custom-sdk-tar/dotnet-linux-x86-sdk.tar.gz -C ~/custom-sdk

      - name: Setup Native 64-bit SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-x86-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Publish App (framework-dependent, will inject runtime)
        shell: bash
        run: |
          dotnet publish "./sb1 sb2 sb3 xml to Csharp converter.csproj" \
            -c Release -r linux-x86 \
            -o "./publish/linux-x86" \
            -p:SelfContained=false \
            -p:UseAppHost=false \
            -p:PublishTrimmed=true \
            -p:TrimMode=partial \
            -p:ExcludeMagickX64=true

      - name: Assemble Self-Contained App & Inject Native Libs
        shell: bash
        run: |
          set -e
          cd ./publish/linux-x86

          # Remove wrong-arch Magick assets
          rm -f Magick.NET-Q16-x64.dll Magick.NET-Q16-arm64.dll libMagick*x64*.so libMagick*arm64*.so || true
          sed -i '/Magick.NET-Q16-x64/d' Converter.deps.json || true
          sed -i '/Magick.NET-Q16-arm64/d' Converter.deps.json || true

          cd "$GITHUB_WORKSPACE"
          mkdir -p ./final-linux-x86
          cp -r ./publish/linux-x86/* ./final-linux-x86/

          # Copy NuGet native .so files for linux-x86
          NUGET_PACKAGES=$(dotnet nuget locals global-packages -l | cut -d' ' -f2)
          find "$NUGET_PACKAGES" -type f -name "*.so" -path "*linux-x86*" | while read so_file; do
            cp "$so_file" ./final-linux-x86/
          done

          # Inject Debian i386 VLC libs
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          mkdir -p ~/debs && cd ~/debs
          sudo apt-get download libvlc5:i386 libvlccore9:i386 vlc-plugin-base:i386 || true
          for deb in *.deb; do dpkg-deb -x "$deb" . || true; done
          find . -name "*.so*" -exec cp {} "$GITHUB_WORKSPACE/final-linux-x86"/ \;
          cd "$GITHUB_WORKSPACE"

          # Inject custom runtime
          cp ~/custom-sdk/dotnet ./final-linux-x86/dotnet
          cp ~/custom-sdk/dotnet-real ./final-linux-x86/dotnet-real
          chmod +x ./final-linux-x86/dotnet ./final-linux-x86/dotnet-real

          # Create run.sh
          cat > ./final-linux-x86/run.sh << 'RUNEOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" &> /dev/null && pwd)"
          export DOTNET_ROOT="$DIR"
          export LD_LIBRARY_PATH="$DIR:$LD_LIBRARY_PATH"
          export DOTNET_GCHeapHardLimit=200000000
          export DOTNET_GCHeapHardLimitPercent=10
          export DOTNET_gcServer=0
          export DOTNET_GCHeapCount=1
          export DOTNET_EnableDiagnostics=0
          export DOTNET_EnableWriteXorExecute=0
          export DOTNET_TieredCompilation=0
          export DOTNET_ReadyToRun=0
          export DOTNET_DefaultStackSize=262144
          ulimit -s 256 2>/dev/null || true
          exec "$DIR/Converter" "$@"
          RUNEOF
          chmod +x ./final-linux-x86/run.sh

          # Create apphost
          python3 - <<'PYEOF'
          import os, glob, sys
          sdk_dir = os.path.expanduser("~/custom-sdk")
          app_dir = "./final-linux-x86"
          apphost_candidates = glob.glob(f"{sdk_dir}/**/apphost", recursive=True)
          placeholder = b"c3ab8ff13720e8ad9047dd39466b3c8974e592c2fa383d4a3960714caef0c4f2"
          dll_name = "Converter.dll"
          if not os.path.exists(os.path.join(app_dir, dll_name)):
              sys.exit(1)
          replacement = dll_name.encode('utf-8') + b"\x00" * (len(placeholder) - len(dll_name))
          output_path = os.path.join(app_dir, "Converter")
          for candidate in apphost_candidates:
              with open(candidate, 'rb') as f:
                  data = bytearray(f.read())
              idx = data.find(placeholder)
              if idx != -1:
                  data[idx:idx+len(placeholder)] = replacement
                  with open(output_path, 'wb') as f:
                      f.write(data)
                  break
          PYEOF
          chmod +x ./final-linux-x86/Converter

          # Copy runtime files
          mkdir -p ./final-linux-x86/host/fxr
          cp -r ~/custom-sdk/host/fxr/* ./final-linux-x86/host/fxr/
          mkdir -p ./final-linux-x86/shared/Microsoft.NETCore.App
          cp -r ~/custom-sdk/shared/Microsoft.NETCore.App/* ./final-linux-x86/shared/Microsoft.NETCore.App/

          # Copy extra assets
          mkdir -p ./final-linux-x86/ConverterIcon
          cp ./ConverterIcon/Converter.ico ./final-linux-x86/ConverterIcon/ || true
          cp ./ConverterIcon/Converter.png ./final-linux-x86/ConverterIcon/ || true
          mkdir -p ./final-linux-x86/Scratch-Format-Converter
          cp ./Scratch-Format-Converter/Convert.js ./final-linux-x86/Scratch-Format-Converter/ || true
          cp ./Scratch-Format-Converter/package.json ./final-linux-x86/Scratch-Format-Converter/ || true
          cp ./Scratch-Format-Converter/package-lock.json ./final-linux-x86/Scratch-Format-Converter/ || true
          mkdir -p ./final-linux-x86/Scratch-To-Snap
          cp ./Scratch-To-Snap/converter.js ./final-linux-x86/Scratch-To-Snap/ || true
          cp ./Scratch-To-Snap/package.json ./final-linux-x86/Scratch-To-Snap/ || true
          cp ./Scratch-To-Snap/package-lock.json ./final-linux-x86/Scratch-To-Snap/ || true
          mkdir -p ./final-linux-x86/svg_library_ScratchJnr
          cp -r ./svg_library_ScratchJnr/* ./final-linux-x86/svg_library_ScratchJnr/ 2>/dev/null || true
          mkdir -p ./final-linux-x86/wav_library_ScratchJnr
          cp -r ./wav_library_ScratchJnr/* ./final-linux-x86/wav_library_ScratchJnr/ 2>/dev/null || true

          # Extract Translate-Folder
          find ./Translate-Folder -type f -name "*.gz" | while read gz_file; do
            dir_name=$(basename "$(dirname "$gz_file")")
            mkdir -p "./final-linux-x86/Translate-Folder/$dir_name"
            out_file=$(basename "$gz_file" .gz)
            gzip -d -c "$gz_file" > "./final-linux-x86/Translate-Folder/$dir_name/$out_file"
          done
          find ./Translate-Folder -type f -name "*.json" | while read json_file; do
            dir_name=$(basename "$(dirname "$json_file")")
            mkdir -p "./final-linux-x86/Translate-Folder/$dir_name"
            cp "$json_file" "./final-linux-x86/Translate-Folder/$dir_name/"
          done
          find ./Translate-Folder -type f -name "*.yml" | while read yml_file; do
            dir_name=$(basename "$(dirname "$yml_file")")
            mkdir -p "./final-linux-x86/Translate-Folder/$dir_name"
            cp "$yml_file" "./final-linux-x86/Translate-Folder/$dir_name/"
          done
          cp ./README.md ./final-linux-x86/ || true

      - name: Create Linux x86 Package
        shell: bash
        run: tar -cJf Converter-linux-x86.tar.xz -C ./final-linux-x86 .

      - name: Upload Artifact (linux x86)
        uses: actions/upload-artifact@v4
        with:
          name: vpk-artifact-linux_x86
          path: ./Converter-linux-x86.tar.xz
          retention-days: 7

  release:
    needs: [build, build_ubuntu-latest_linux-x86]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all-assets
          merge-multiple: true

      - name: Push to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.9.${{ github.run_number }}
          files: |
            ./all-assets/*