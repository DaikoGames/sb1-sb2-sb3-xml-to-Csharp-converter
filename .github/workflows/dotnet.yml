name: Deploy to GitHub Releases
on: 
  schedule:
     - cron: '30 14 * * 6' 
  workflow_dispatch:
     
permissions:
  contents: write
  
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: windows-latest
            runtime: win-arm64
          - os: windows-latest
            runtime: win-x86
          - os: ubuntu-latest
            runtime: linux-x64
          - os: ubuntu-latest
            runtime: linux-arm
          - os: ubuntu-latest
            runtime: linux-arm64
          - os: macos-latest
            runtime: osx-x64
          - os: macos-latest
            runtime: osx-arm64

    runs-on: ${{ matrix.os }}
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Checkout External Dependency (Scratch-Format-Converter)
        uses: actions/checkout@v4
        with:
          repository: 'DaikoGames/ScratchConverter'
          path: Scratch-Format-Converter
          
      - name: Checkout External Dependency (Scratch-To-Snap)
        uses: actions/checkout@v4
        with:
          repository: 'DaikoGames/scratch-snap-bridge'
          path: Scratch-To-Snap
          
      - name: Checkout External Dependency (Translator)
        uses: actions/checkout@v4
        with:
          repository: 'DaikoGames/Translate-Folder'
          path: Translate-Folder
          
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build and Publish App
        shell: bash
        run: |
          dotnet publish "./sb1 sb2 sb3 xml to Csharp converter.csproj" \
            -c Release \
            -r ${{ matrix.runtime }} \
            -o "./publish/${{ matrix.runtime }}" \
            -p:SelfContained=true \
            -p:PublishSingleFile=true \
            -p:RuntimeIdentifiers=${{ matrix.runtime }}

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Add dotnet tools to PATH
        shell: bash
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Add files (Windows)
        shell: pwsh
        if: contains(matrix.runtime, 'win')  
        run: |
          $baseDir = "./publish/${{ matrix.runtime }}"
          New-Item -ItemType Directory -Force -Path "$baseDir/ConverterIcon"
          Copy-Item "./ConverterIcon/Converter.ico" "$baseDir/ConverterIcon/Converter.ico"
          Copy-Item "./ConverterIcon/Converter.png" "$baseDir/ConverterIcon/Converter.png"
          New-Item -ItemType Directory -Force -Path "$baseDir/Scratch-Format-Converter"
          Copy-Item "./Scratch-Format-Converter/Convert.js" "$baseDir/Scratch-Format-Converter/Convert.js"
          Copy-Item "./Scratch-Format-Converter/package.json" "$baseDir/Scratch-Format-Converter/package.json"
          Copy-Item "./Scratch-Format-Converter/package-lock.json" "$baseDir/Scratch-Format-Converter/package-lock.json"
          New-Item -ItemType Directory -Force -Path "$baseDir/Scratch-To-Snap"
          Copy-Item "./Scratch-To-Snap/public/downloads/converter.js" "$baseDir/Scratch-To-Snap/converter.js"
          Copy-Item "./Scratch-To-Snap/README.md" "$baseDir/Scratch-To-Snap/README.md"
          
          New-Item -ItemType Directory -Force -Path "$baseDir/Install"
          Copy-Item "./Install/dotnet-install.ps1" "$baseDir/Install/dotnet-install.ps1"
          New-Item -ItemType Directory -Force -Path "$baseDir/svg_library_ScratchJnr"
          Copy-Item -Path "./svg_library_ScratchJnr/*" "$baseDir/svg_library_ScratchJnr"
          New-Item -ItemType Directory -Force -Path "$baseDir/wav_library_ScratchJnr"
          Copy-Item "./wav_library_ScratchJnr/*" "$baseDir/wav_library_ScratchJnr" 
          $GZfiles = Get-ChildItem -Path "./Translate-Folder" -Recurse -Filter "*.gz" -ErrorAction Stop
          foreach ($GZfile in $GZfiles) {
            $GZDirectoryName = $GZfile.Directory.Name
            New-Item -ItemType Directory -Force -Path "$baseDir/Translate-Folder/$GZDirectoryName" | Out-Null
            $OutFileName = $GZfile.Name -replace '\.gz$', ''
            gzip -d -c $GZfile.FullName > "$baseDir/Translate-Folder/$GZDirectoryName/$OutFileName"
            Remove-Item $GZfile.FullName -Force
          }
          $JSONFiles = Get-ChildItem -Path "./Translate-Folder" -Recurse -Filter "*.json" -ErrorAction Stop 
          foreach ($JSONfile in $JSONFiles){
            $JSONFileName = $JSONfile.Name
            $JSONDirectoryName = (Get-Item $JSONfile).Directory.Name
            Copy-Item -Path $JSONfile.FullName "$baseDir/Translate-Folder/$JSONDirectoryName/$JSONFileName" -Force
          }
          $YMLFiles = Get-ChildItem -Path "./Translate-Folder" -Recurse -Filter "*.yml" -ErrorAction Stop 
          foreach ($YMLfile in $YMLFiles){
            $JYMLFileName = $YMLfile.Name
            $YMLDirectoryName = (Get-Item $YMLfile).Directory.Name
            Copy-Item -Path $YMLfile.FullName "$baseDir/Translate-Folder/$YMLDirectoryName/$JYMLFileName" -Force
          }
          Copy-Item "./README.md" "$baseDir/README.md"
  
      - name: Add Files (Linux, MacOS)
        shell: pwsh
        if: contains(matrix.runtime, 'linux') || contains(matrix.runtime, 'osx')
        run: |
          $baseDir = "./publish/${{ matrix.runtime }}"
          New-Item -ItemType Directory -Force -Path "$baseDir/ConverterIcon"
          Copy-Item "./ConverterIcon/Converter.ico" "$baseDir/ConverterIcon/Converter.ico"
          Copy-Item "./ConverterIcon/Converter.png" "$baseDir/ConverterIcon/Converter.png"
          New-Item -ItemType Directory -Force -Path "$baseDir/Scratch-Format-Converter"
          Copy-Item "./Scratch-Format-Converter/Convert.js" "$baseDir/Scratch-Format-Converter/Convert.js"
          Copy-Item "./Scratch-Format-Converter/package.json" "$baseDir/Scratch-Format-Converter/package.json"
          Copy-Item "./Scratch-Format-Converter/package-lock.json" "$baseDir/Scratch-Format-Converter/package-lock.json"
          New-Item -ItemType Directory -Force -Path "$baseDir/Scratch-To-Snap"
          Copy-Item "./Scratch-To-Snap/public/downloads/converter.js" "$baseDir/Scratch-To-Snap/converter.js"
          Copy-Item "./Scratch-To-Snap/README.md" "$baseDir/Scratch-To-Snap/README.md"
          
          New-Item -ItemType Directory -Force -Path "$baseDir/Install"
          Copy-Item "./Install/dotnet-install.sh" "$baseDir/Install/dotnet-install.sh"
          New-Item -ItemType Directory -Force -Path "$baseDir/svg_library_ScratchJnr"
          Copy-Item "./svg_library_ScratchJnr/*" "$baseDir/svg_library_ScratchJnr" 
          New-Item -ItemType Directory -Force -Path "$baseDir/wav_library_ScratchJnr"
          Copy-Item "./wav_library_ScratchJnr/*" "$baseDir/wav_library_ScratchJnr" 
          $GZ_files = Get-ChildItem -Path "./Translate-Folder" -Recurse -Filter "*.gz" -ErrorAction Stop
          foreach ($GZfile in $GZ_files) {
            $GZDirectoryName = $GZfile.Directory.Name
            New-Item -ItemType Directory -Force -Path "$baseDir/Translate-Folder/$GZDirectoryName" | Out-Null
            $OutFileName = $GZfile.Name -replace '\.gz$', ''
            gzip -d -c $GZfile.FullName > "$baseDir/Translate-Folder/$GZDirectoryName/$OutFileName"
            Remove-Item $GZfile.FullName -Force
          }
          $JSONFiles = Get-ChildItem -Path "./Translate-Folder" -Recurse -Filter "*.json" -ErrorAction Stop 
          foreach ($JSONfile in $JSONFiles){
            $JSONFileName = $JSONfile.Name
            $JSONDirectoryName = (Get-Item $JSONfile).Directory.Name
            Copy-Item -Path $JSONfile.FullName "$baseDir/Translate-Folder/$JSONDirectoryName/$JSONFileName" -Force
          }
          $YMLFiles = Get-ChildItem -Path "./Translate-Folder" -Recurse -Filter "*.yml" -ErrorAction Stop 
          foreach ($YMLfile in $YMLFiles){
            $JYMLFileName = $YMLfile.Name
            $YMLDirectoryName = (Get-Item $YMLfile).Directory.Name
            Copy-Item -Path $YMLfile.FullName "$baseDir/Translate-Folder/$YMLDirectoryName/$JYMLFileName" -Force
          }
          Copy-Item "./README.md" "$baseDir/README.md"
          
      - name: Check Help
        shell: bash
        run: vpk pack --help
          
      - name: Pack with Velopack Windows
        shell: bash
        if: contains(matrix.runtime, 'win')
        run: |
          vpk pack \
            -u "Converter" \
            -v "0.9.${{ github.run_number }}" \
            --packDir "./publish/${{ matrix.runtime }}" \
            --outputDir "./Releases" \
            --icon "./ConverterIcon/Converter.ico" \
            --channel "${{ matrix.runtime }}"
            
      - name: Pack with Velopack Linux (AppImage)
        shell: bash
        if: contains(matrix.runtime, 'linux') && matrix.runtime != 'linux-arm'
        run: |
          vpk pack \
            -u "Converter" \
            -v "0.9.${{ github.run_number }}" \
            --packDir "./publish/${{ matrix.runtime }}" \
            --outputDir "./Releases" \
            --icon "./ConverterIcon/Converter.png" \
            --channel "${{ matrix.runtime }}"

      - name: Create Portable Zip for Linux ARM 
        shell: bash
        if: matrix.runtime == 'linux-arm'
        run: |
          mkdir -p ./Releases
          cd "./publish/${{ matrix.runtime }}"
          zip -r "../../Releases/Converter-${{ matrix.runtime }}-Portable.zip" .
            
      - name: Pack with Velopack MacOS
        shell: bash
        if: contains(matrix.runtime, 'osx')
        run: |
          vpk pack \
            -u "Converter" \
            -v "0.9.${{ github.run_number }}" \
            --packDir "./publish/${{ matrix.runtime }}" \
            --outputDir "./Releases" \
            --icon "./ConverterIcon/Converter.icns" \
            --channel "${{ matrix.runtime }}"

      # --- FLATPAK BUILD STEPS FOR LINUX X64 ---
      - name: Install Flatpak tools (Linux x64)
        if: matrix.runtime == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08

      - name: Generate Flatpak Files and Build (Linux x64)
        if: matrix.runtime == 'linux-x64'
        run: |
          # 1. Generate Desktop Entry on the fly
          cat << 'EOF' > com.daikogames.Converter.desktop
          [Desktop Entry]
          Name=Converter
          Comment=SB1/SB2/SB3/XML to C# Converter
          Exec=Converter
          Icon=com.daikogames.Converter
          Terminal=false
          Type=Application
          Categories=Development;Utility;
          EOF

          # 2. Generate AppStream Metadata on the fly (required for clean builds)
          cat << 'EOF' > com.daikogames.Converter.appdata.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>com.daikogames.Converter</id>
            <name>Converter</name>
            <summary>SB1/SB2/SB3/XML to C# Converter</summary>
            <metadata_license>CC0-1.0</metadata_license>
            <project_license>MIT</project_license>
            <description><p>Converts Scratch projects to C#.</p></description>
          </component>
          EOF

          # 3. Copy them into the publish dir so flatpak-builder can see them
          cp com.daikogames.Converter.desktop publish/linux-x64/
          cp com.daikogames.Converter.appdata.xml publish/linux-x64/

          # 4. Generate Flatpak Manifest on the fly
          cat << 'EOF' > com.daikogames.Converter.yml
          app-id: com.daikogames.Converter
          runtime: org.freedesktop.Platform
          runtime-version: '23.08'
          sdk: org.freedesktop.Sdk
          command: Converter
          finish-args:
            - --share=ipc
            - --socket=x11
            - --socket=wayland
            - --device=dri
            - --filesystem=host
            - --share=network
          modules:
            - name: converter
              buildsystem: simple
              build-commands:
                - install -Dm755 Converter /app/bin/Converter
                - install -Dm644 com.daikogames.Converter.desktop /app/share/applications/com.daikogames.Converter.desktop
                - install -Dm644 com.daikogames.Converter.appdata.xml /app/share/metainfo/com.daikogames.Converter.appdata.xml
                - install -Dm644 ConverterIcon/Converter.png /app/share/icons/hicolor/256x256/apps/com.daikogames.Converter.png
                - cp -r --no-preserve=ownership Scratch-Format-Converter Scratch-To-Snap Translate-Folder svg_library_ScratchJnr wav_library_ScratchJnr Install /app/bin/ || true
              sources:
                - type: dir
                  path: publish/linux-x64
          EOF

          # 5. Build the Flatpak
          mkdir -p ./Releases
          flatpak-builder --user --install-deps-from=flathub --force-clean flatpak-build com.daikogames.Converter.yml
          flatpak build-bundle flatpak-repo ./Releases/Converter-linux.flatpak com.daikogames.Converter
      # -----------------------------------------------
     
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vpk-artifacts-${{ matrix.runtime }}
          path: ./Releases/*
          
  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: ./all-assets
          merge-multiple: true

      - name: Push to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.9.${{ github.run_number }}
          files: |
                 ./all-assets/Converter-win-x86-Setup.exe
                 ./all-assets/Converter-win-x64-Setup.exe
                 ./all-assets/Converter-win-arm64-Setup.exe
                 ./all-assets/Converter-osx-x64-Setup.pkg
                 ./all-assets/Converter-osx-arm64-Setup.pkg
                 ./all-assets/Converter-linux-x64.AppImage
                 ./all-assets/Converter-linux-arm64.AppImage
                 ./all-assets/Converter-linux.flatpak
                 ./all-assets/Converter-win-x86-Portable.zip
                 ./all-assets/Converter-win-x64-Portable.zip
                 ./all-assets/Converter-win-arm64-Portable.zip
                 ./all-assets/Converter-osx-x64-Portable.zip
                 ./all-assets/Converter-osx-arm64-Portable.zip
                 ./all-assets/Converter-linux-x64-Portable.zip
                 ./all-assets/Converter-linux-arm-Portable.zip
                 ./all-assets/Converter-linux-arm64-Portable.zip
